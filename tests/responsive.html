<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Verificação responsiva</title><style>body{font:16px system-ui;background:#fff;color:#222}iframe{border:1px solid #ccc;display:block;margin:16px 0}pre{white-space:pre-wrap}</style><h1>Verificação responsiva</h1><pre id="result">Carregando...</pre><iframe title="Prévia no celular" src="../index.html" width="390" height="844"></iframe><script>
