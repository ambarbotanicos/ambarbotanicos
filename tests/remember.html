<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Testes de dados lembrados</title><pre id="results">Executando...</pre><nav><div><div></div></div></nav><div id="grid-produtos-catalogo"></div><script>
const scenario=new URLSearchParams(location.search).get('case')||'pf',memory=new Map(),key='shop-buyer-v1';
const buyer=scenario==='pj'?'pj':'pf';
const values=buyer==='pj'?{cnpj:'12.345.678/0001-90',legalName:'Empresa de Teste',businessPhone:'(21) 3333-4444',number:'100'}:{name:'Cliente de Teste',cpf:'123.456.789-01',phone:'(21) 99999-8888',number:'100'};
memory.set(key,JSON.stringify({consentVersion:1,consentedAt:Date.now()-1000,expiresAt:scenario==='expired'?Date.now()-1:Date.now()+100000,buyer,values}));
Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,v),removeItem:k=>memory.delete(k)}});
const db={from:()=>({select:()=>({eq:()=>({single:async()=>({data:null,error:null})})})})};
</script><script src="../js/shop.js?v=remember-buyer"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const reports=[],assert=(n,v)=>{if(!v)throw Error(n);reports.push('PASSOU: '+n);};try{const form=document.getElementById('checkout-form');if(scenario==='expired'){assert('Dados vencidos são apagados',!localStorage.getItem(key));assert('Consentimento expirado não é reativado',!form.querySelector('.remember-data').checked);assert('Documento expirado não é preenchido',form.elements.cpf.value==='');}else{assert('Tipo de comprador é restaurado',form.dataset.buyer===buyer);assert('Documento e número são restaurados',form.elements[buyer==='pj'?'cnpj':'cpf'].value===values[buyer==='pj'?'cnpj':'cpf']&&form.elements.number.value==='100');assert('Consentimento existente sincroniza as duas opções',Array.from(form.querySelectorAll('.remember-data')).every(el=>el.checked));form.querySelector('fieldset:not([disabled]) .forget-buyer').click();assert('Botão apagar remove o armazenamento',!localStorage.getItem(key));assert('Apagar limpa dados do formulário',form.elements.number.value===''&&form.elements[buyer==='pj'?'cnpj':'cpf'].value==='');assert('Apagar retira o consentimento',Array.from(form.querySelectorAll('.remember-data')).every(el=>!el.checked));}document.body.dataset.testResult='passed';}catch(e){reports.push('FALHOU: '+e.message);document.body.dataset.testResult='failed';}document.getElementById('results').textContent=reports.join('\n');});
</script></html>
