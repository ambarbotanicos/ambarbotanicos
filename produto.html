<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produto Botânico | Âmbar Botânicos</title>
    <meta name="description"
        content="Conheça os detalhes deste ingrediente botânico selecionado pela Âmbar Botânicos. Faça seu pedido via WhatsApp com facilidade e rapidez.">
    <link rel="canonical" href="https://ambarbotanicos.com.br/">

    <!-- Open Graph (atualizado dinamicamente pelo produto.js) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ambarbotanicos.com.br/">
    <meta property="og:title" content="Produto Botânico | Âmbar Botânicos">
    <meta property="og:description"
        content="Conheça este ingrediente botânico selecionado pela Âmbar. Peça pelo WhatsApp!">
    <meta property="og:image" content="https://ambarbotanicos.com.br/img/logo-header.svg">

    <!-- Schema.org JSON-LD (será substituído dinamicamente pelo produto.js) -->
    <script type="application/ld+json" id="jsonld-produto">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "Produto Botânico",
      "brand": { "@type": "Brand", "name": "Âmbar Botânicos" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Roboto:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/shop.css">
</head>

<body class="bg-background text-foreground font-sans min-h-screen">

    <!-- MENU -->
    <nav aria-label="Menu principal" class="site-nav border-b border-border bg-background/95 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
            <a href="index.html" aria-label="Âmbar Botânicos" class="site-brand inline-flex items-center hover:opacity-90"><img src="img/logo-header.svg" alt="Âmbar Botânicos" class="h-12 w-auto" /></a>
            <div class="site-nav-links flex items-center gap-6">
                <a href="sobre.html" class="text-sm font-medium hover:opacity-70">Sobre a Âmbar</a>
                <a href="produtores.html" class="text-sm font-medium hover:opacity-70">Produtores</a>
                <a href="quem-acredita.html" class="text-sm font-medium hover:opacity-70">Guia Âmbar</a>
            </div>
        </div>
    </nav>

    <!-- TOPO DO PRODUTO (dinâmico) -->
    <section class="max-w-6xl mx-auto px-6 py-14">
        <div id="product-overview">
        <div class="h-[440px] rounded-sm overflow-hidden bg-secondary">
            <img id="prod-img" src="" alt="" class="w-full h-full object-cover" loading="lazy" />
        </div>
        <div class="pt-2">
            <h1 id="prod-nome" class="font-sans text-5xl font-semibold leading-none mb-4">Carregando...</h1>
            <p id="prod-descricao-curta" class="text-sm leading-relaxed mb-8 max-w-sm"></p>
            <div id="product-purchase"></div>

        </div>
        </div>
    </section>

    <!-- FICHA TÉCNICA -->
    <section class="border-t border-border bg-muted">
        <div class="max-w-6xl mx-auto px-6 py-14">
            <p class="text-[10px] font-mono uppercase tracking-widest text-muted-foreground mb-8">Ficha técnica</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                <table id="ficha-table" class="w-full text-sm">
                    <tbody id="ficha-body">
                        <!-- preenchido dinamicamente -->
                    </tbody>
                </table>
                <div>
                    <p class="text-[10px] font-mono uppercase tracking-widest text-muted-foreground mb-4">Perfil
                        sensorial</p>
                    <p id="prod-descricao" class="text-sm text-muted-foreground leading-relaxed mb-6"></p>
                    <!-- RADAR CHART (dinâmico) -->
                    <div id="radar-container" class="flex justify-center"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- PARCEIROS -->
    <section class="border-t border-border py-14" id="section-parceiros">
        <div class="max-w-6xl mx-auto px-6">
            <p class="text-[10px] font-mono uppercase tracking-widest text-muted-foreground mb-10">Parceiros</p>
            <div id="parceiros-container-front" class="flex gap-10 overflow-x-auto">
                <!-- parceiros dinâmicos inseridos via JS -->
            </div>
        </div>
    </section>

    <!-- CTA FINAL -->
    <footer class="bg-foreground text-primary-foreground py-20">
        <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-8">
            <div>
                <p class="text-primary-foreground/60 text-sm leading-relaxed max-w-md">
                    © 2026 Âmbar Botânicos. Todos os direitos reservados.
                </p>
            </div>
            <div class="flex items-center gap-4">
                <a href="https://www.instagram.com/ambarbotanicos/" target="_blank" rel="noopener noreferrer"
                    aria-label="Instagram" class="text-primary-foreground hover:opacity-80 transition-opacity">
                    <i class="bi bi-instagram text-2xl"></i>
                </a>
                <a href="https://wa.me/5521967453706?text=Ol%C3%A1%2C%20vim%20pelo%20site%20e%20gostaria%20de%20receber%20mais%20informa%C3%A7%C3%B5es%20sobre%20a%20%C3%82mbar%20Bot%C3%A2nicos."
                    target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"
                    class="text-primary-foreground hover:opacity-80 transition-opacity">
                    <i class="bi bi-whatsapp text-2xl"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- SUPABASE + RADAR + DADOS DO PRODUTO -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/script.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/produto.js"></script>
</body>

</html>
